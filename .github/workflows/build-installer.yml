name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/kpower-foundation
      - main
    paths:
      - "kpower-app/**"
      - ".github/workflows/build-installer.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kpower-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kpower-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kpower-app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (MSI + NSIS)
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kpower-windows-installers
          path: |
            kpower-app/src-tauri/target/release/bundle/msi/*.msi
            kpower-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
